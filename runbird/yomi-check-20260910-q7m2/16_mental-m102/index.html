/sign/yomi-check/20260910_from7/16_mental-m102/audio/p2_s06.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzE2X21lbnRhbC1tMTAyL2F1ZGlvL3AyX3MwNi5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY3LCJleHAiOjE4MDQ1NzQyNjd9.vgQ0x5WLnzS2RhWZTEY0B01-pebHKM8ilxbxz-0YJdE"}, {"id": "p2_s07", "text": "正しく理解することが、安心できる支援の第一歩になります。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/16_mental-m102/audio/p2_s07.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzE2X21lbnRhbC1tMTAyL2F1ZGlvL3AyX3MwNy5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY3LCJleHAiOjE4MDQ1NzQyNjd9.pXRIJA4JW2ap5Z9JX3RaYO9LGp8o_idGQDLHU_thbu8"}]}, {"page": 3, "label": "シーン 3", "rows": [{"id": "p3_s01", "text": "統合失調症は、考えや気持ちをまとめる力が低下し、幻覚や妄想などの症状が現れる病気です。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/16_mental-m102/audio/p3_s01.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzE2X21lbnRhbC1tMTAyL2F1ZGlvL3AzX3MwMS5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY3LCJleHAiOjE4MDQ1NzQyNjd9.RE53IrLLR42nQYnqfQ4O7CsF_8sm1Z_QD7eEOmXYo1w"}, {"id": "p3_s02", "text": "多くは思春期から青年期にかけて発症します。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/16_mental-m102/audio/p3_s02.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzE2X21lbnRhbC1tMTAyL2F1ZGlvL3AzX3MwMi5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY3LCJleHAiOjE4MDQ1NzQyNjd9.jZIDBLDzxyRB5aipI-XliOx4bU1oVVPOeRFjkjAW6lc"}, {"id": "p3_s03", "text": "決してまれな病気ではなく、誰でもかかる可能性があります。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-chec 47OEu4M8Yw8"}, {"id": "p8_s02", "text": "統合失調症は、考えや気持ちをまとめる力が低下する病気で、誰でもかかる可能性があります。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/16_mental-m102/audio/p8_s02.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzE2X21lbnRhbC1tMTAyL2F1ZGlvL3A4X3MwMi5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY3LCJleHAiOjE4MDQ1NzQyNjd9.dlNtXK1fgykiYmQIjbJKZl-BEpKb9fX_oek-Wl9i6_Y"}, {"id": "p8_s03", "text": "治療を続けることで、地域で安定して暮らすことができます。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/16_mental-m102/audio/p8_s03.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzE2X21lbnRhbC1tMTAyL2F1ZGlvL3A4X3MwMy5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY3LCJleHAiOjE4MDQ1NzQyNjd9.WRYLP-wZKMzBYVO0ez-o8i6bvDE6hBt0FPys3iXEjSE"}, {"id": "p8_s04", "text": "症状は、幻覚や妄想などの陽性症状、意欲低下などの陰性症状、集中や段取りが苦手になる認知機能の症状の3つです。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/16_mental-m102/audio/p8_s04.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzE2X21lbnRhbC1tMTAyL2F1ZGlvL3A4X3MwNC5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY3LCJleHAiOjE4MDQ1NzQyNjd9.kaRwtVrSgfIbv6RqKn9FpCbcLxwEinJbWotBGCxZSHg"}, {"id": "p8_s05", "text": "幻聴や妄想には、否定も肯定もせず、つらさに寄り添うこと。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/16_mental-m102/audio/p8_s05.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzE2X21lbnRhbC1tMTAyL2F1ZGlvL3A4X3MwNS5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY3LCJleHAiOjE4MDQ1NzQyNjd9.MNIQfzhTuCBOZ_DPVqGSHXzOUNH2tfPps15s_IaD11o"}, {"id": "p8_s06", "text": "陰性症状には、急かさず、小さな一歩を認めること。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/16_mental-m102/audio/p8_s06.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzE2X21lbnRhbC1tMTAyL2F1ZGlvL3A4X3MwNi5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY3LCJleHAiOjE4MDQ1NzQyNjd9.o6Mk_NoLUTi2qHJy-fo2-PysEJf9pobILQHvMs70Glw"}, {"id": "p8_s07", "text": "服薬の継続を支え、飲み忘れや中断のサインは、記録して報告すること。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/16_mental-m102/audio/p8_s07.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzE2X21lbnRhbC1tMTAyL2F1ZGlvL3A4X3MwNy5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY3LCJleHAiOjE4MDQ1NzQyNjd9.pVPsidwMG73RKpjtlcBtd6oVwEk02tUihDMUrGtF6Aw"}, {"id": "p8_s08", "text": "危険を感じたら、ひとりで対応せず、すぐに管理者へ連絡してください。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/16_mental-m102/audio/p8_s08.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzE2X21lbnRhbC1tMTAyL2F1ZGlvL3A4X3MwOC5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY3LCJleHAiOjE4MDQ1NzQyNjd9.n7YTCiYd-WMeEPYT_F1QpuX1_y8yazdaEggKflC2c7c"}, {"id": "p8_s09", "text": "なお、本動画は一般的な解説です。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/16_mental-m102/audio/p8_s09.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzE2X21lbnRhbC1tMTAyL2F1ZGlvL3A4X3MwOS5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY3LCJleHAiOjE4MDQ1NzQyNjd9.O1e9N279n6BIcd3tGlJyy4bowEEhwiKKfh0w9ucy8to"}, {"id": "p8_s10", "text": "診断や治療は専門医の判断によります。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/16_mental-m102/audio/p8_s10.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzE2X21lbnRhbC1tMTAyL2F1ZGlvL3A4X3MxMC5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY3LCJleHAiOjE4MDQ1NzQyNjd9.lU2KNP-lQtE_uR0zo_nwaGGnnW8lL8XwC75qVvG5vqM"}, {"id": "p8_s11", "text": "最新の情報をご確認ください。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/16_mental-m102/audio/p8_s11.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzE2X21lbnRhbC1tMTAyL2F1ZGlvL3A4X3MxMS5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY3LCJleHAiOjE4MDQ1NzQyNjd9.Wji1aC6tQCY-JJ2lyFwcyBjrj8F6MPzy04OUqVzfiDQ"}]}]; const KEY="check_16. 統合失調症の理解と接し方"; const TOTAL=63;
const KINDS=[["ok","OK"],["yomi","読み違い"],["ma","間がほしい"],["into","イントネーション"],["other","その他"]];
let state={}; try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){state={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){} prog();}
function prog(){const d=Object.values(state).filter(v=>v.k).length;document.getElementById("prog").textContent=`　進み具合: ${d} / ${TOTAL} 文`;}
let cur=null;
const main=document.getElementById("main");
for(const pg of PAGES){
  const sec=document.createElement("section");sec.className="page";sec.innerHTML=`<h2>${pg.label}</h2>`;
  for(const r of pg.rows){
    const st=state[r.id]||{};
    const div=document.createElement("div");div.className="row"+(st.k?" done":"");div.id=r.id;
    div.innerHTML=`<button class="play" title="再生">▶</button><div><div class="txt">${r.text}</div><div class="btns">${KINDS.map(([k,l])=>`<button data-k="${k}" class="${k==="ok"?"ok":"ng"} ${st.k===k?"sel":""}">${l}</button>`).join("")}</div><textarea class="note ${st.k&&st.k!=="ok"?"show":""}" placeholder="どの言葉が・どう聞こえたか（例：ふくえき／〜の後に間）">${st.n||""}</textarea></div>`;
    const au=new Audio(r.audio); const pb=div.querySelector(".play");
    pb.onclick=()=>{ if(cur&&cur!==au){cur.pause();cur.currentTime=0;document.querySelectorAll(".play.on").forEach(b=>b.classList.remove("on"));}
      if(!au.paused){au.pause();au.currentTime=0;pb.classList.remove("on");return;} cur=au;au.currentTime=0;au.play();pb.classList.add("on");};
    au.onended=()=>pb.classList.remove("on");
    div.querySelectorAll(".btns button").forEach(b=>b.onclick=()=>{const k=b.dataset.k;state[r.id]={...(state[r.id]||{}),k,t:r.text,p:pg.label};
      div.querySelectorAll(".btns button").forEach(x=>x.classList.toggle("sel",x===b));div.classList.add("done");
      const ta=div.querySelector(".note");ta.classList.toggle("show",k!=="ok");if(k!=="ok")ta.focus();save();});
    div.querySelector(".note").oninput=e=>{state[r.id]={...(state[r.id]||{}),n:e.target.value,t:r.text,p:pg.label};save();};
    sec.appendChild(div);
  }
  main.appendChild(sec);
}
prog();
function report(){const L=[`【16. 統合失調症の理解と接し方 読みチェック結果】`];const lab=Object.fromEntries(KINDS);let ng=0;
  for(const pg of PAGES)for(const r of pg.rows){const s=state[r.id];if(s&&s.k&&s.k!=="ok"){ng++;L.push(`■${pg.label} ${lab[s.k]}：${r.text}`);if(s.n)L.push(`　→ ${s.n}`);}}
  const d=Object.values(state).filter(v=>v.k).length;L.push(`（確認 ${d}/${TOTAL} 文・指摘 ${ng} 件）`);return L.join("\n");}
document.getElementById("copy").onclick=async()=>{const t=report();const box=document.getElementById("outbox");box.value=t;box.style.display="block";try{await navigator.clipboard.writeText(t);alert("コピーしました。LINE WORKSに貼り付けてください。")}catch(e){box.select();alert("下の枠の文章を選択してコピーしてください。")}};
document.getElementById("show").onclick=()=>{const box=document.getElementById("outbox");box.value=report();box.style.display=box.style.display==="block"?"none":"block";};
document.getElementById("reset").onclick=()=>{if(confirm("すべての判定を消しますか？")){state={};save();location.reload();}};
</script></body></html>
