<style>body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;margin:0;background:#f5f6f8;color:#222}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:10px 16px;z-index:5}h1{font-size:17px;margin:0 0 4px}.sub{font-size:13px;color:#555}

<header><h1>イントネーション聞き比べ</h1><div class="sub">同じ文を、言葉の書き方だけ変えて読ませています。全部聞いて、一番自然に聞こえるものの「これ」を押してください。どれも同じ／どれも違う場合はその下のボタンを。最後に「結果をコピー」でLINE WORKSに貼ってください。</div></header>

id": "p1_s05", "label": "5 十八番（漢数字）", "text": "このうち、十八番と21番は必須です。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260929_kikikurabe5/audio/p1_s05.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTI5X2tpa2lrdXJhYmU1L2F1ZGlvL3AxX3MwNS5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzkwNjc4OTgxLCJleHAiOjE4MDYyMzA5ODF9.LM6jDvj8PQBbK9VcPrkwltF4WuR1frWytsJSYG7OqGs"}], "note": "機械で確認したところ、いまの音声は「じゅうはちばん」で出ています（「じゅうわち」にはなっていません）。それでも聞き取りづらい場合に備えて、言い方を変えた候補を並べました"}, {"i": 2, "word": "四部屋", "sent": "1階に居室が一部屋、2階に居室が四部屋の、あわせて五居室の間取りです。", "vars": [{"id": "p2_s01", "label": "1 現行（ひとへや・よんへや）", "text": "1階に居室が一部屋、2階に居室が四部屋の、あわせて五居室の間取りです。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260929_kikikurabe5/audio/p2_s01.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTI5X2tpa2lrdXJhYmU1L2F1ZGlvL3AyX3MwMS5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzkwNjc4OTgxLCJleHAiOjE4MDYyMzA5ODF9.oU6BdlUU7mz_H4lkZLH4osFIevaI5BkkDE9FpXNlDbI"}, {"id": "p2_s02", "label": "2 よん部屋", "text": "1階に居室が一部屋、2階に居室がよん部屋の、あわせて五居室の間取りです。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260929_kikikurabe5/audio/p2_s02.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTI5X2tpa2lrdXJhYmU1L2F1ZGlvL3AyX3MwMi5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzkwNjc4OTgxLCJleHAiOjE4MDYyMzA5ODF9.1Z6uTbuZlkbC9F0mLJJ-5kx1dn-XDFB1sBQG-1VcEPo"}, {"id": "p2_s03", "label": "3 4室（1室・4室・5居室に統一）※修正案", "text": "1階に居室が一部屋、2階に居室が4室の、あわせて五居室の間取りです。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260929_kikikurabe5/audio/p2_s03.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTI5X2tpa2lrdXJhYmU1 function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}let cur=null;const main=document.getElementById("main");
for(const it of ITEMS){const s=st[it.i]||{};const d=document.createElement("section");d.className="item";d.innerHTML=`<h2>${it.i}. ${it.word}</h2><div class="sent">例文：${it.sent}${it.note?"　※"+it.note:""}</div>`;
 for(const v of it.vars){const r=document.createElement("div");r.className="v";r.innerHTML=`<button class="play">▶</button><span class="lab">${v.label}<small>${v.text}</small></span><button class="pick ${s.pick===v.id?"sel":""}">これ</button>`;
  const au=new Audio(v.audio);const pb=r.querySelector(".play");pb.onclick=()=>{if(cur&&cur!==au){cur.pause();cur.currentTime=0;document.querySelectorAll(".play.on").forEach(b=>b.classList.remove("on"));}if(!au.paused){au.pause();au.currentTime=0;pb.classList.remove("on");return;}cur=au;au.currentTime=0;au.play();pb.classList.add("on");};au.onended=()=>pb.classList.remove("on");
  r.querySelector(".pick").onclick=e=>{st[it.i]={...(st[it.i]||{}),pick:v.id,label:v.label,none:""};d.querySelectorAll(".pick").forEach(x=>x.classList.toggle("sel",x===e.target));d.querySelectorAll(".none button").forEach(x=>x.classList.remove("sel"));save();};d.appendChild(r);}
 const n=document.createElement("div");n.className="none";n.innerHTML=`<button data-k="same" class="${s.none==="same"?"sel":""}">どれも同じに聞こえる</button><button data-k="bad" class="${s.none==="bad"?"sel":""}">どれも違和感がある</button>`;
 n.querySelectorAll("button").forEach(b=>b.onclick=()=>{st[it.i]={...(st[it.i]||{}),none:b.dataset.k,pick:"",label:""};n.querySelectorAll("button").forEach(x=>x.classList.toggle("sel",x===b));d.querySelectorAll(".pick").forEach(x=>x.classList.remove("sel"));save();});d.appendChild(n);
 const ta=document.createElement("textarea");ta.className="note";ta.placeholder="ひとこと（例：2は後半が下がりすぎ）";ta.value=s.memo||"";ta.oninput=e=>{st[it.i]={...(st[it.i]||{}),memo:e.target.value};save();};d.appendChild(ta);main.appendChild(d);}
document.getElementById("copy").onclick=async()=>{const L=["【イントネーション聞き比べ 結果】"];for(const it of ITEMS){const s=st[it.i]||{};let r=s.pick?`${s.label}`:s.none==="same"?"どれも同じ":s.none==="bad"?"どれも違和感":"未回答";L.push(`■${it.i}. ${it.word} → ${r}${s.memo?"（"+s.memo+"）":""}`);}const t=L.join("\n");const b=document.getElementById("outbox");b.value=t;b.style.display="block";try{await navigator.clipboard.writeText(t);alert("コピーしました。LINE WORKSに貼り付けてください。")}catch(e){b.select();alert("下の枠の文章を選択してコピーしてください。")}};</script></body></html>
