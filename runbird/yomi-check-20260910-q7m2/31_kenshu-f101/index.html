では足りない場合があります。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/31_kenshu-f101/audio/p6_s02.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzMxX2tlbnNodS1mMTAxL2F1ZGlvL3A2X3MwMi5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.nrdKbj1DSDNqVZ_EDup8rp1FGUl9fMmXW52PueBDlUs"}, {"id": "p6_s03", "text": "ご相談の段階で、受給者証をお持ちか、申請中か、これから申請か、を確認できると、その後のご案内がスムーズになります。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/31_kenshu-f101/audio/p6_s03.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzMxX2tlbnNodS1mMTAxL2F1ZGlvL3A2X3MwMy5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.9sOuU2xIfb-34jDXajxM8oGfcoEcy0PKHbc2E1c3hik"}]}, {"page": 7, "label": "シーン 7", "rows": [{"id": "p7_s01", "text": "今日の要点は3つ。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/31_kenshu-f101/audio/p7_s01.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzMxX2tlbnNodS1mMTAxL2F1ZGlvL3A3X3MwMS5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.gqn6vOIShyf4RrrlWfbt3dG1vycvwzgjZ0M5HY6_IGI"}, {"id": "p7_s02", "text": "ひとつ、手帳は「証明書」、受給者証は「サービス利用許可証」。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/31_kenshu-f101/audio/p7_s02.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzMxX2tlbnNodS1mMTAxL2F1ZGlvL3A3X3MwMi5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.y9pBumpb-Gg8RgW9_HHJLK_rWgo6eCpsboa3VFLo038"}, {"id": "p7_s03", "text": "ふたつ、グループホームの利用と請求は、受給者証が中心。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/31_kenshu-f101/audio/p7_s03.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzMxX2tlbnNodS1mMTAxL2F1ZGlvL3A3X3MwMy5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.nxzHzbFdeoXcoFdoWfl7bAkX6s8quG-4LGnkMsl7gXY"}, {"id": "p7_s04", "text": "みっつ、支給の可否や手続きの詳細は、必ずお住まいの自治体の窓口で確認する。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/31_kenshu-f101/audio/p7_s04.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzMxX2tlbnNodS1mMTAxL2F1ZGlvL3A3X3MwNC5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.El84GvCGgQcfoG8qoePq10wdlcBDAWkiHBEpxuStzmQ"}, {"id": "p7_s05", "text": "以上、次の動画でお会いしましょう。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/31_kenshu-f101/audio/p7_s05.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzMxX2tlbnNodS1mMTAxL2F1ZGlvL3A3X3MwNS5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.CG-ZuEfUPg9N1lijGH87nD9OjM_100TKMwE2496ivbA"}]}]; const KEY="check_31. 障がい者手帳と受給者証の違い"; const TOTAL=27;
const KINDS=[["ok","OK"],["yomi","読み違い"],["ma","間がほしい"],["into","イントネーション"],["other","その他"]];
let state={}; try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){state={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){} prog();}
function prog(){const d=Object.values(state).filter(v=>v.k).length;document.getElementById("prog").textContent=`　進み具合: ${d} / ${TOTAL} 文`;}
let cur=null;
const main=document.getElementById("main");
for(const pg of PAGES){
  const sec=document.createElement("section");sec.className="page";sec.innerHTML=`<h2>${pg.label}</h2>`;
  for(const r of pg.rows){
    const st=state[r.id]||{};
    const div=document.createElement("div");div.className="row"+(st.k?" done":"");div.id=r.id;
    div.innerHTML=`<button class="play" title="再生">▶</button><div><div class="txt">${r.text}</div><div class="btns">${KINDS.map(([k,l])=>`<button data-k="${k}" class="${k==="ok"?"ok":"ng"} ${st.k===k?"sel":""}">${l}</button>`).join("")}</div><textarea class="note ${st.k&&st.k!=="ok"?"show":""}" placeholder="どの言葉が・どう聞こえたか（例：ふくえき／〜の後に間）">${st.n||""}</textarea></div>`;
    const au=new Audio(r.audio); const pb=div.querySelector(".play");
    pb.onclick=()=>{ if(cur&&cur!==au){cur.pause();cur.currentTime=0;document.querySelectorAll(".play.on").forEach(b=>b.classList.remove("on"));}
      if(!au.paused){au.pause();au.currentTime=0;pb.classList.remove("on");return;} cur=au;au.currentTime=0;au.play();pb.classList.add("on");};
    au.onended=()=>pb.classList.remove("on");
    div.querySelectorAll(".btns button").forEach(b=>b.onclick=()=>{const k=b.dataset.k;state[r.id]={...(state[r.id]||{}),k,t:r.text,p:pg.label};
      div.querySelectorAll(".btns button").forEach(x=>x.classList.toggle("sel",x===b));div.classList.add("done");
      const ta=div.querySelector(".note");ta.classList.toggle("show",k!=="ok");if(k!=="ok")ta.focus();save();});
    div.querySelector(".note").oninput=e=>{state[r.id]={...(state[r.id]||{}),n:e.target.value,t:r.text,p:pg.label};save();};
    sec.appendChild(div);
  }
  main.appendChild(sec);
}
prog();
function report(){const L=[`【31. 障がい者手帳と受給者証の違い 読みチェック結果】`];const lab=Object.fromEntries(KINDS);let ng=0;
  for(const pg of PAGES)for(const r of pg.rows){const s=state[r.id];if(s&&s.k&&s.k!=="ok"){ng++;L.push(`■${pg.label} ${lab[s.k]}：${r.text}`);if(s.n)L.push(`　→ ${s.n}`);}}
  const d=Object.values(state).filter(v=>v.k).length;L.push(`（確認 ${d}/${TOTAL} 文・指摘 ${ng} 件）`);return L.join("\n");}
document.getElementById("copy").onclick=async()=>{const t=report();const box=document.getElementById("outbox");box.value=t;box.style.display="block";try{await navigator.clipboard.writeText(t);alert("コピーしました。LINE WORKSに貼り付けてください。")}catch(e){box.select();alert("下の枠の文章を選択してコピーしてください。")}};
document.getElementById("show").onclick=()=>{const box=document.getElementById("outbox");box.value=report();box.style.display=box.style.display==="block"?"none":"block";};
document.getElementById("reset").onclick=()=>{if(confirm("すべての判定を消しますか？")){state={};save();location.reload();}};
</script></body></html>
