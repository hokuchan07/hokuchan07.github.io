7_setsu-k034/audio/p19_s03.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzQ3X3NldHN1LWswMzQvYXVkaW8vcDE5X3MwMy5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.IcUf9Yw0uG7yJiI8TwBOd4fa8k7kx1sAM0db3eXbopw"}, {"id": "p19_s04", "text": "なお、指定権者によっては体制届や勤務形態一覧表等が必要な場合もありますので、確認してください。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/47_setsu-k034/audio/p19_s04.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzQ3X3NldHN1LWswMzQvYXVkaW8vcDE5X3MwNC5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.r0Wku16sMpqiV54H22UaSiYhqmfBk0tGnqcVTC5EX84"}]}, {"page": 20, "label": "スライド 20", "rows": [{"id": "p20_s01", "text": "医療連携体制加算Ⅶのまとめです。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/47_setsu-k034/audio/p20_s01.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzQ3X3NldHN1LWswMzQvYXVkaW8vcDIwX3MwMS5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.Gz_5cs2dQILVrlqn1sWXI0FCZA2b0hCp9Npna49fMDg"}, {"id": "p20_s02", "text": "概要は、適切な医療ケアを提供できる体制を構築していることを評価するもの。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/47_setsu-k034/audio/p20_s02.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzQ3X3NldHN1LWswMzQvYXVkaW8vcDIwX3MwMi5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.boPtp39oABCPkWPk3bZI_hiq8Uu-W406wDMp4zpSAbU"}, {"id": "p20_s03", "text": "要件は、雇用または医療連携により正看護師を1人以上配置すること、看護師業務に必要な勤務時間数を確保すること、24時間いつでも連絡が取れる体制を確保すること、そして重度化した場合における対応に係る指針を作成することの4つ。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/47_setsu-k034/audio/p20_s03.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzQ3X3NldHN1LWswMzQvYXVkaW8vcDIwX3MwMy5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.qPN5pcqELcVBPZPPaG1ns0-ROXPgP-55arDv2r57pfI"}, {"id": "p20_s04", "text": "単位数は1日あたり39単位です。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/47_setsu-k034/audio/p20_s04.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzQ3X3NldHN1LWswMzQvYXVkaW8vcDIwX3MwNC5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.sAM9ItuES8k8DrM2Sfhgz88GNkeAbptv13Ri_g07azE"}, {"id": "p20_s05", "text": "次の動画では、看護職員配置加算と医療的ケア対応支援加算を見ていきます。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/47_setsu-k034/audio/p20_s05.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzQ3X3NldHN1LWswMzQvYXVkaW8vcDIwX3MwNS5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.6yB29J9LClBiiYfZ55LGA4i8yDuMf9ceBkCljnOjU9c"}]}]; const KEY="check_47. 各種加算②／医療連携体制加算Ⅶ"; const TOTAL=58;
const KINDS=[["ok","OK"],["yomi","読み違い"],["ma","間がほしい"],["into","イントネーション"],["other","その他"]];
let state={}; try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){state={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){} prog();}
function prog(){const d=Object.values(state).filter(v=>v.k).length;document.getElementById("prog").textContent=`　進み具合: ${d} / ${TOTAL} 文`;}
let cur=null;
const main=document.getElementById("main");
for(const pg of PAGES){
  const sec=document.createElement("section");sec.className="page";sec.innerHTML=`<h2>${pg.label}</h2>`;
  for(const r of pg.rows){
    const st=state[r.id]||{};
    const div=document.createElement("div");div.className="row"+(st.k?" done":"");div.id=r.id;
    div.innerHTML=`<button class="play" title="再生">▶</button><div><div class="txt">${r.text}</div><div class="btns">${KINDS.map(([k,l])=>`<button data-k="${k}" class="${k==="ok"?"ok":"ng"} ${st.k===k?"sel":""}">${l}</button>`).join("")}</div><textarea class="note ${st.k&&st.k!=="ok"?"show":""}" placeholder="どの言葉が・どう聞こえたか（例：ふくえき／〜の後に間）">${st.n||""}</textarea></div>`;
    const au=new Audio(r.audio); const pb=div.querySelector(".play");
    pb.onclick=()=>{ if(cur&&cur!==au){cur.pause();cur.currentTime=0;document.querySelectorAll(".play.on").forEach(b=>b.classList.remove("on"));}
      if(!au.paused){au.pause();au.currentTime=0;pb.classList.remove("on");return;} cur=au;au.currentTime=0;au.play();pb.classList.add("on");};
    au.onended=()=>pb.classList.remove("on");
    div.querySelectorAll(".btns button").forEach(b=>b.onclick=()=>{const k=b.dataset.k;state[r.id]={...(state[r.id]||{}),k,t:r.text,p:pg.label};
      div.querySelectorAll(".btns button").forEach(x=>x.classList.toggle("sel",x===b));div.classList.add("done");
      const ta=div.querySelector(".note");ta.classList.toggle("show",k!=="ok");if(k!=="ok")ta.focus();save();});
    div.querySelector(".note").oninput=e=>{state[r.id]={...(state[r.id]||{}),n:e.target.value,t:r.text,p:pg.label};save();};
    sec.appendChild(div);
  }
  main.appendChild(sec);
}
prog();
function report(){const L=[`【47. 各種加算②／医療連携体制加算Ⅶ 読みチェック結果】`];const lab=Object.fromEntries(KINDS);let ng=0;
  for(const pg of PAGES)for(const r of pg.rows){const s=state[r.id];if(s&&s.k&&s.k!=="ok"){ng++;L.push(`■${pg.label} ${lab[s.k]}：${r.text}`);if(s.n)L.push(`　→ ${s.n}`);}}
  const d=Object.values(state).filter(v=>v.k).length;L.push(`（確認 ${d}/${TOTAL} 文・指摘 ${ng} 件）`);return L.join("\n");}
document.getElementById("copy").onclick=async()=>{const t=report();const box=document.getElementById("outbox");box.value=t;box.style.display="block";try{await navigator.clipboard.writeText(t);alert("コピーしました。LINE WORKSに貼り付けてください。")}catch(e){box.select();alert("下の枠の文章を選択してコピーしてください。")}};
document.getElementById("show").onclick=()=>{const box=document.getElementById("outbox");box.value=report();box.style.display=box.style.display==="block"?"none":"block";};
document.getElementById("reset").onclick=()=>{if(confirm("すべての判定を消しますか？")){state={};save();location.reload();}};
</script></body></html>
