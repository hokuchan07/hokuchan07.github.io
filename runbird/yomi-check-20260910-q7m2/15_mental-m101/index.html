    div.innerHTML=`<button class="play" title="再生">▶</button><div><div class="txt">${r.text}</div><div class="btns">${KINDS.map(([k,l])=>`<button data-k="${k}" class="${k==="ok"?"ok":"ng"} ${st.k===k?"sel":""}">${l}</button>`).join("")}</div><textarea class="note ${st.k&&st.k!=="ok"?"show":""}" placeholder="どの言葉が・どう聞こえたか（例：ふくえき／〜の後に間）">${st.n||""}</textarea></div>`;
    const au=new Audio(r.audio); const pb=div.querySelector(".play");
    pb.onclick=()=>{ if(cur&&cur!==au){cur.pause();cur.currentTime=0;document.querySelectorAll(".play.on").forEach(b=>b.classList.remove("on"));}
      if(!au.paused){au.pause();au.currentTime=0;pb.classList.remove("on");return;} cur=au;au.currentTime=0;au.play();pb.classList.add("on");};
    au.onended=()=>pb.classList.remove("on");
    div.querySelectorAll(".btns button").forEach(b=>b.onclick=()=>{const k=b.dataset.k;state[r.id]={...(state[r.id]||{}),k,t:r.text,p:pg.label};
      div.querySelectorAll(".btns button").forEach(x=>x.classList.toggle("sel",x===b));div.classList.add("done");
      const ta=div.querySelector(".note");ta.classList.toggle("show",k!=="ok");if(k!=="ok")ta.focus();save();});
    div.querySelector(".note").oninput=e=>{state[r.id]={...(state[r.id]||{}),n:e.target.value,t:r.text,p:pg.label};save();};
    sec.appendChild(div);
  }
  main.appendChild(sec);
}
prog();
function report(){const L=[`【15. 精神疾患の基礎と支援の心構え 読みチェック結果】`];const lab=Object.fromEntries(KINDS);let ng=0;
  for(const pg of PAGES)for(const r of pg.rows){const s=state[r.id];if(s&&s.k&&s.k!=="ok"){ng++;L.push(`■${pg.label} ${lab[s.k]}：${r.text}`);if(s.n)L.push(`　→ ${s.n}`);}}
  const d=Object.values(state).filter(v=>v.k).length;L.push(`（確認 ${d}/${TOTAL} 文・指摘 ${ng} 件）`);return L.join("\n");}
document.getElementById("copy").onclick=async()=>{const t=report();const box=document.getElementById("outbox");box.value=t;box.style.display="block";try{await navigator.clipboard.writeText(t);alert("コピーしました。LINE WORKSに貼り付けてください。")}catch(e){box.select();alert("下の枠の文章を選択してコピーしてください。")}};
document.getElementById("show").onclick=()=>{const box=document.getElementById("outbox");box.value=report();box.style.display=box.style.display==="block"?"none":"block";};
document.getElementById("reset").onclick=()=>{if(confirm("すべての判定を消しますか？")){state={};save();location.reload();}};
</script></body></html>
