_s04", "text": "日々の実績記録を正確につけることが、いちばんの返戻予防になります。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/33_kenshu-f103/audio/p6_s04.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzMzX2tlbnNodS1mMTAzL2F1ZGlvL3A2X3MwNC5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.l3_cvWIpCoMlk-97m5pxH3hc6UuaihofaxwHaE-iWPs"}]}, {"page": 7, "label": "シーン 7", "rows": [{"id": "p7_s01", "text": "今日の要点は3つ。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/33_kenshu-f103/audio/p7_s01.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzMzX2tlbnNodS1mMTAzL2F1ZGlvL3A3X3MwMS5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.VGUAShKlSIEaJfgre9jJ5_OAodT70vr7uBgiZqQd9B8"}, {"id": "p7_s02", "text": "ひとつ、給付費は国保連へ電子請求し、入金は翌々月が目安。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/33_kenshu-f103/audio/p7_s02.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzMzX2tlbnNodS1mMTAzL2F1ZGlvL3A3X3MwMi5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.58qV5K4lEFNYP-83UtDFHaPoUY98x02N0EBrmX4Ygzc"}, {"id": "p7_s03", "text": "ふたつ、必須書類は、請求明細書と実績記録票の2つ。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/33_kenshu-f103/audio/p7_s03.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzMzX2tlbnNodS1mMTAzL2F1ZGlvL3A3X3MwMy5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.ASPzcEU-ZY84sE-NMg6XZBSkLcEyhRiSp5SF6Gbz7e8"}, {"id": "p7_s04", "text": "みっつ、受給者証の支給決定内容との整合が生命線。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/33_kenshu-f103/audio/p7_s04.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzMzX2tlbnNodS1mMTAzL2F1ZGlvL3A3X3MwNC5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.pfkE7H9l9eE6qBIS8aV0s1FY5ANg3thIs6Z6KvJaPpI"}, {"id": "p7_s05", "text": "操作の手順はソフトや環境で異なるため、国保連のマニュアルと、本部SVに確認してください。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/33_kenshu-f103/audio/p7_s05.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzMzX2tlbnNodS1mMTAzL2F1ZGlvL3A3X3MwNS5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.l5sTJnJmQuDac9hmP9_oKDQHIF80Y1AX2peRKGS7IT8"}, {"id": "p7_s06", "text": "以上、次の動画でお会いしましょう。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/33_kenshu-f103/audio/p7_s06.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzMzX2tlbnNodS1mMTAzL2F1ZGlvL3A3X3MwNi5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.tCbICsibzyt2QrESymbtHDygxo3IN7yFzbQdOaTI6Vw"}]}]; const KEY="check_33. 国保連請求の基礎"; const TOTAL=27;
const KINDS=[["ok","OK"],["yomi","読み違い"],["ma","間がほしい"],["into","イントネーション"],["other","その他"]];
let state={}; try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){state={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){} prog();}
function prog(){const d=Object.values(state).filter(v=>v.k).length;document.getElementById("prog").textContent=`　進み具合: ${d} / ${TOTAL} 文`;}
let cur=null;
const main=document.getElementById("main");
for(const pg of PAGES){
  const sec=document.createElement("section");sec.className="page";sec.innerHTML=`<h2>${pg.label}</h2>`;
  for(const r of pg.rows){
    const st=state[r.id]||{};
    const div=document.createElement("div");div.className="row"+(st.k?" done":"");div.id=r.id;
    div.innerHTML=`<button class="play" title="再生">▶</button><div><div class="txt">${r.text}</div><div class="btns">${KINDS.map(([k,l])=>`<button data-k="${k}" class="${k==="ok"?"ok":"ng"} ${st.k===k?"sel":""}">${l}</button>`).join("")}</div><textarea class="note ${st.k&&st.k!=="ok"?"show":""}" placeholder="どの言葉が・どう聞こえたか（例：ふくえき／〜の後に間）">${st.n||""}</textarea></div>`;
    const au=new Audio(r.audio); const pb=div.querySelector(".play");
    pb.onclick=()=>{ if(cur&&cur!==au){cur.pause();cur.currentTime=0;document.querySelectorAll(".play.on").forEach(b=>b.classList.remove("on"));}
      if(!au.paused){au.pause();au.currentTime=0;pb.classList.remove("on");return;} cur=au;au.currentTime=0;au.play();pb.classList.add("on");};
    au.onended=()=>pb.classList.remove("on");
    div.querySelectorAll(".btns button").forEach(b=>b.onclick=()=>{const k=b.dataset.k;state[r.id]={...(state[r.id]||{}),k,t:r.text,p:pg.label};
      div.querySelectorAll(".btns button").forEach(x=>x.classList.toggle("sel",x===b));div.classList.add("done");
      const ta=div.querySelector(".note");ta.classList.toggle("show",k!=="ok");if(k!=="ok")ta.focus();save();});
    div.querySelector(".note").oninput=e=>{state[r.id]={...(state[r.id]||{}),n:e.target.value,t:r.text,p:pg.label};save();};
    sec.appendChild(div);
  }
  main.appendChild(sec);
}
prog();
function report(){const L=[`【33. 国保連請求の基礎 読みチェック結果】`];const lab=Object.fromEntries(KINDS);let ng=0;
  for(const pg of PAGES)for(const r of pg.rows){const s=state[r.id];if(s&&s.k&&s.k!=="ok"){ng++;L.push(`■${pg.label} ${lab[s.k]}：${r.text}`);if(s.n)L.push(`　→ ${s.n}`);}}
  const d=Object.values(state).filter(v=>v.k).length;L.push(`（確認 ${d}/${TOTAL} 文・指摘 ${ng} 件）`);return L.join("\n");}
document.getElementById("copy").onclick=async()=>{const t=report();const box=document.getElementById("outbox");box.value=t;box.style.display="block";try{await navigator.clipboard.writeText(t);alert("コピーしました。LINE WORKSに貼り付けてください。")}catch(e){box.select();alert("下の枠の文章を選択してコピーしてください。")}};
document.getElementById("show").onclick=()=>{const box=document.getElementById("outbox");box.value=report();box.style.display=box.style.display==="block"?"none":"block";};
document.getElementById("reset").onclick=()=>{if(confirm("すべての判定を消しますか？")){state={};save();location.reload();}};
</script></body></html>
