: "また、職員がすでに重度訪問介護従業者養成研修の行動障害支援課程を修了している、または当該年度内に受講予定がある場合は、強度行動障害支援者養成研修の基礎を修了または受講予定とみなします。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/56_setsu-k043/audio/p59_s03.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzU2X3NldHN1LWswNDMvYXVkaW8vcDU5X3MwMy5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY5LCJleHAiOjE4MDQ1NzQyNjl9.xLeHARNKWMnEUTOPFjHSYxZIFQMEHltJpOAnqrryvEk"}, {"id": "p59_s04", "text": "同様に、職員がすでに行動援護従業者養成研修の課程を修了している、または当該年度内に受講予定がある場合は、強度行動障害支援者養成研修の基礎および実践を修了または受講予定とみなし、強度行動障害支援者養成研修の欄に「有」または受講予定月を記載します。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/56_setsu-k043/audio/p59_s04.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzU2X3NldHN1LWswNDMvYXVkaW8vcDU5X3MwNC5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY5LCJleHAiOjE4MDQ1NzQyNjl9.cOFvI4qOsqmvgWz1Y58tAWI7JhHnb3i-Oholte7W1x4"}, {"id": "p59_s05", "text": "他の研修が読み替えられるという点は、届出のときに見落としやすいポイントです。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/56_setsu-k043/audio/p59_s05.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzU2X3NldHN1LWswNDMvYXVkaW8vcDU5X3MwNS5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY5LCJleHAiOjE4MDQ1NzQyNjl9.n_soEDqb2AZ9eIOvzoRllmcwUJIs43aEiLybTZtleuM"}, {"id": "p59_s06", "text": "次の動画では、前年度実績に基づく配置時間の計算を例題で確認します。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/56_setsu-k043/audio/p59_s06.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzU2X3NldHN1LWswNDMvYXVkaW8vcDU5X3MwNi5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY5LCJleHAiOjE4MDQ1NzQyNjl9.bjGoePAIQBVoeYy9dhJXaiihl4ut0NBM0I2VrmEnGcw"}]}]; const KEY="check_56. 体制届編③／夜間支援等体制加算・重度障害者支援加算"; const TOTAL=56;
const KINDS=[["ok","OK"],["yomi","読み違い"],["ma","間がほしい"],["into","イントネーション"],["other","その他"]];
let state={}; try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){state={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){} prog();}
function prog(){const d=Object.values(state).filter(v=>v.k).length;document.getElementById("prog").textContent=`　進み具合: ${d} / ${TOTAL} 文`;}
let cur=null;
const main=document.getElementById("main");
for(const pg of PAGES){
  const sec=document.createElement("section");sec.className="page";sec.innerHTML=`<h2>${pg.label}</h2>`;
  for(const r of pg.rows){
    const st=state[r.id]||{};
    const div=document.createElement("div");div.className="row"+(st.k?" done":"");div.id=r.id;
    div.innerHTML=`<button class="play" title="再生">▶</button><div><div class="txt">${r.text}</div><div class="btns">${KINDS.map(([k,l])=>`<button data-k="${k}" class="${k==="ok"?"ok":"ng"} ${st.k===k?"sel":""}">${l}</button>`).join("")}</div><textarea class="note ${st.k&&st.k!=="ok"?"show":""}" placeholder="どの言葉が・どう聞こえたか（例：ふくえき／〜の後に間）">${st.n||""}</textarea></div>`;
    const au=new Audio(r.audio); const pb=div.querySelector(".play");
    pb.onclick=()=>{ if(cur&&cur!==au){cur.pause();cur.currentTime=0;document.querySelectorAll(".play.on").forEach(b=>b.classList.remove("on"));}
      if(!au.paused){au.pause();au.currentTime=0;pb.classList.remove("on");return;} cur=au;au.currentTime=0;au.play();pb.classList.add("on");};
    au.onended=()=>pb.classList.remove("on");
    div.querySelectorAll(".btns button").forEach(b=>b.onclick=()=>{const k=b.dataset.k;state[r.id]={...(state[r.id]||{}),k,t:r.text,p:pg.label};
      div.querySelectorAll(".btns button").forEach(x=>x.classList.toggle("sel",x===b));div.classList.add("done");
      const ta=div.querySelector(".note");ta.classList.toggle("show",k!=="ok");if(k!=="ok")ta.focus();save();});
    div.querySelector(".note").oninput=e=>{state[r.id]={...(state[r.id]||{}),n:e.target.value,t:r.text,p:pg.label};save();};
    sec.appendChild(div);
  }
  main.appendChild(sec);
}
prog();
function report(){const L=[`【56. 体制届編③／夜間支援等体制加算・重度障害者支援加算 読みチェック結果】`];const lab=Object.fromEntries(KINDS);let ng=0;
  for(const pg of PAGES)for(const r of pg.rows){const s=state[r.id];if(s&&s.k&&s.k!=="ok"){ng++;L.push(`■${pg.label} ${lab[s.k]}：${r.text}`);if(s.n)L.push(`　→ ${s.n}`);}}
  const d=Object.values(state).filter(v=>v.k).length;L.push(`（確認 ${d}/${TOTAL} 文・指摘 ${ng} 件）`);return L.join("\n");}
document.getElementById("copy").onclick=async()=>{const t=report();const box=document.getElementById("outbox");box.value=t;box.style.display="block";try{await navigator.clipboard.writeText(t);alert("コピーしました。LINE WORKSに貼り付けてください。")}catch(e){box.select();alert("下の枠の文章を選択してコピーしてください。")}};
document.getElementById("show").onclick=()=>{const box=document.getElementById("outbox");box.value=report();box.style.display=box.style.display==="block"?"none":"block";};
document.getElementById("reset").onclick=()=>{if(confirm("すべての判定を消しますか？")){state={};save();location.reload();}};
</script></body></html>
