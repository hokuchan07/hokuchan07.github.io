C8H3Rr6uPB2k"}, {"id": "p11_s02", "text": "計画書には、職員1人あたりの平均賃金改善見込額を記載し、その内容を全職員に周知する必要があります。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/40_setsu-k023/audio/p11_s02.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzQwX3NldHN1LWswMjMvYXVkaW8vcDExX3MwMi5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.wKevEQkrdzq_1q91kRfgLKQwIqXWeRc1HetTWEMLU5Q"}, {"id": "p11_s03", "text": "これにより事業者は、職員によって金額に差異があることや、キャリアアップ制度について周知させることができます。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/40_setsu-k023/audio/p11_s03.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzQwX3NldHN1LWswMjMvYXVkaW8vcDExX3MwMy5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.l-GcA4rRxmbDO0zcegcORd2LJnib4k0XTdDH_Inx80Q"}, {"id": "p11_s04", "text": "職員の側も、おおよその加算額や支給方法・頻度を知ることができる、というわけです。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/40_setsu-k023/audio/p11_s04.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzQwX3NldHN1LWswMjMvYXVkaW8vcDExX3MwNC5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.T6XjsCkAQO_hud49tMTb8_qynxxU_iz-Rp0M_QoCKfQ"}, {"id": "p11_s05", "text": "以上が、加算の算定にあたっての手続きです。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/40_setsu-k023/audio/p11_s05.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzQwX3NldHN1LWswMjMvYXVkaW8vcDExX3MwNS5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.ba2-06vWxaRNkaioHkfXpFVN5NVN_h_P32JS-WlVWfg"}, {"id": "p11_s06", "text": "次の動画では、実際の計画書の作り方を画面に沿って見ていきます。", "audio": "https://rarhnvcaktwvyheudsri.supabase.co/storage/v1/object/sign/yomi-check/20260910_from7/40_setsu-k023/audio/p11_s06.mp3?token=eyJraWQiOiI3OTA5M2YzMC0xZmEyLTQ3ZWMtOGJiOS0xZGY3ZjZhNjhhMDQiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ5b21pLWNoZWNrLzIwMjYwOTEwX2Zyb203LzQwX3NldHN1LWswMjMvYXVkaW8vcDExX3MwNi5tcDMiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5MDIyMjY4LCJleHAiOjE4MDQ1NzQyNjh9.wVCPXeCb6to8ATr6BN5VpD63nTFXQvNmqpzNeotyN5U"}]}]; const KEY="check_40. 処遇改善加算／運用編①／算定にあたって"; const TOTAL=45;
const KINDS=[["ok","OK"],["yomi","読み違い"],["ma","間がほしい"],["into","イントネーション"],["other","その他"]];
let state={}; try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){state={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){} prog();}
function prog(){const d=Object.values(state).filter(v=>v.k).length;document.getElementById("prog").textContent=`　進み具合: ${d} / ${TOTAL} 文`;}
let cur=null;
const main=document.getElementById("main");
for(const pg of PAGES){
  const sec=document.createElement("section");sec.className="page";sec.innerHTML=`<h2>${pg.label}</h2>`;
  for(const r of pg.rows){
    const st=state[r.id]||{};
    const div=document.createElement("div");div.className="row"+(st.k?" done":"");div.id=r.id;
    div.innerHTML=`<button class="play" title="再生">▶</button><div><div class="txt">${r.text}</div><div class="btns">${KINDS.map(([k,l])=>`<button data-k="${k}" class="${k==="ok"?"ok":"ng"} ${st.k===k?"sel":""}">${l}</button>`).join("")}</div><textarea class="note ${st.k&&st.k!=="ok"?"show":""}" placeholder="どの言葉が・どう聞こえたか（例：ふくえき／〜の後に間）">${st.n||""}</textarea></div>`;
    const au=new Audio(r.audio); const pb=div.querySelector(".play");
    pb.onclick=()=>{ if(cur&&cur!==au){cur.pause();cur.currentTime=0;document.querySelectorAll(".play.on").forEach(b=>b.classList.remove("on"));}
      if(!au.paused){au.pause();au.currentTime=0;pb.classList.remove("on");return;} cur=au;au.currentTime=0;au.play();pb.classList.add("on");};
    au.onended=()=>pb.classList.remove("on");
    div.querySelectorAll(".btns button").forEach(b=>b.onclick=()=>{const k=b.dataset.k;state[r.id]={...(state[r.id]||{}),k,t:r.text,p:pg.label};
      div.querySelectorAll(".btns button").forEach(x=>x.classList.toggle("sel",x===b));div.classList.add("done");
      const ta=div.querySelector(".note");ta.classList.toggle("show",k!=="ok");if(k!=="ok")ta.focus();save();});
    div.querySelector(".note").oninput=e=>{state[r.id]={...(state[r.id]||{}),n:e.target.value,t:r.text,p:pg.label};save();};
    sec.appendChild(div);
  }
  main.appendChild(sec);
}
prog();
function report(){const L=[`【40. 処遇改善加算／運用編①／算定にあたって 読みチェック結果】`];const lab=Object.fromEntries(KINDS);let ng=0;
  for(const pg of PAGES)for(const r of pg.rows){const s=state[r.id];if(s&&s.k&&s.k!=="ok"){ng++;L.push(`■${pg.label} ${lab[s.k]}：${r.text}`);if(s.n)L.push(`　→ ${s.n}`);}}
  const d=Object.values(state).filter(v=>v.k).length;L.push(`（確認 ${d}/${TOTAL} 文・指摘 ${ng} 件）`);return L.join("\n");}
document.getElementById("copy").onclick=async()=>{const t=report();const box=document.getElementById("outbox");box.value=t;box.style.display="block";try{await navigator.clipboard.writeText(t);alert("コピーしました。LINE WORKSに貼り付けてください。")}catch(e){box.select();alert("下の枠の文章を選択してコピーしてください。")}};
document.getElementById("show").onclick=()=>{const box=document.getElementById("outbox");box.value=report();box.style.display=box.style.display==="block"?"none":"block";};
document.getElementById("reset").onclick=()=>{if(confirm("すべての判定を消しますか？")){state={};save();location.reload();}};
</script></body></html>
